[package]
name = "rebebuca-remote-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rebebuca-remote-agent"
path = "src/main.rs"

[dependencies]
rebebuca-common = { path = "../common", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
