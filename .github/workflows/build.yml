# Publishes via npm Trusted Publishing (OIDC). Configure on npmjs.com with workflow file: build.yml
# Requires Node >= 22.14 and npm CLI >= 11.5.1 (see https://docs.npmjs.com/trusted-publishers).
name: Build and Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for server (Nuxt static)
        run: pnpm run build:server-app

      # pnpm publish delegates to npm CLI; ensure npm meets OIDC trusted publishing minimum.
      - name: Upgrade npm for OIDC publish
        run: timeout 120 npm install -g npm@latest

      - name: Publish to npm (Trusted Publisher / OIDC)
        run: npm publish --access public
