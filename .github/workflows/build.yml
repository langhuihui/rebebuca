# Publishes via npm Trusted Publishing (OIDC). Configure on npmjs.com with workflow file: build.yml
# Requires Node >= 22.14 and npm CLI >= 11.5.1 (see https://docs.npmjs.com/trusted-publishers).
name: Build and Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Do not set registry-url here: setup-node injects a placeholder NODE_AUTH_TOKEN when none is provided,
      # which prevents npm Trusted Publishing (OIDC) and surfaces as E404 Not Found on PUT.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for server (Nuxt static)
        run: pnpm run build:server-app

      - name: Verify npm tarball includes static UI
        shell: bash
        run: |
          set -euo pipefail
          test -f web-public/index.html
          timeout 180 npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -q 'web-public/index.html' /tmp/npm-pack.txt || {
            echo 'npm pack output is missing web-public; refusing to publish.'
            exit 1
          }

      # pnpm publish delegates to npm CLI; ensure npm meets OIDC trusted publishing minimum (>= 11.5.1).
      # Do not use `npm install -g npm@latest`: some GitHub-hosted Node toolcache builds ship a broken global npm (e.g. MODULE_NOT_FOUND: promise-retry). Corepack activates a full npm install without self-upgrade.
      - name: Upgrade npm for OIDC publish
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 bash -c 'corepack enable && corepack prepare npm@11.12.1 --activate'
          npm --version

      - name: Publish to npm (Trusted Publisher / OIDC)
        run: npm publish --access public
