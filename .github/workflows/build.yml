# Publishes via npm Trusted Publishing (OIDC). Configure on npmjs.com with workflow file: build.yml
# Use Node 24+ so the bundled npm meets Trusted Publishing (npm CLI >= 11.5.1); see https://docs.npmjs.com/trusted-publishers
name: Build and Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for server (Nuxt static)
        run: pnpm run build:server-app

      - name: Verify npm tarball includes static UI
        shell: bash
        run: |
          set -euo pipefail
          test -f web-public/index.html
          timeout 180 npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -q 'web-public/index.html' /tmp/npm-pack.txt || {
            echo 'npm pack output is missing web-public; refusing to publish.'
            exit 1
          }

      - name: Publish to npm (Trusted Publisher / OIDC)
        run: npm publish --access public
