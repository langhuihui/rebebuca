name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  cleanup-caches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate current cache hashes
        id: hashes
        run: |
          PNPM_HASH=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1 | head -c 16)
          echo "pnpm_hash=$PNPM_HASH" >> $GITHUB_OUTPUT
          echo "Current pnpm hash: $PNPM_HASH"

      - name: Cleanup outdated caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up outdated caches..."
          
          PNPM_HASH="${{ steps.hashes.outputs.pnpm_hash }}"
          
          gh cache list --limit 100 --json id,key | jq -r '.[] | "\(.id) \(.key)"' | while read -r id key; do
            DELETE=false
            
            if echo "$key" | grep -q "pnpm-store"; then
              if ! echo "$key" | grep -q "$PNPM_HASH"; then
                DELETE=true
              fi
            fi
            
            if echo "$key" | grep -qE "^(Linux|macOS|Windows|linux)-cargo"; then
              DELETE=true
            fi
            
            if [ "$DELETE" = true ]; then
              echo "Deleting outdated cache: $key (id: $id)"
              gh cache delete "$id" || true
            fi
          done
          
          echo "Cache cleanup completed"

  build-remote-server:
    needs: cleanup-caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            remote-agent-server -> target
            common -> target
          cache-on-failure: true
          key: x86_64-unknown-linux-musl

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend for server
        run: pnpm build:server

      - name: Build remote-agent-server for Linux (x86_64)
        run: |
          cd remote-agent-server
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Package remote-agent-server with web assets
        run: |
          VERSION=${{ github.ref_name }}
          mkdir -p package/rebebuca-remote-server
          cp remote-agent-server/target/x86_64-unknown-linux-musl/release/rebebuca-remote-server package/rebebuca-remote-server/
          cp -r dist package/rebebuca-remote-server/
          cd package
          tar -czvf rebebuca-remote-server-linux-x86_64.tar.gz rebebuca-remote-server

      - name: Install rclone
        run: |
          sudo apt-get install -y rclone jq

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ID }}
          secret_access_key = ${{ secrets.R2_SECRET }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload remote-agent-server to R2
        run: |
          VERSION=${{ github.ref_name }}
          rclone copyto package/rebebuca-remote-server-linux-x86_64.tar.gz \
            r2:monibuca/rb/${VERSION}/remote-agent-server/rebebuca-remote-server-linux-x86_64.tar.gz --progress

      - name: Upload installer script
        run: |
          rclone copyto scripts/install-remote-server.sh \
            r2:monibuca/rb/install-remote-server.sh --progress

  build-macos:
    needs: cleanup-caches
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            remote-agent -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (Universal)
        run: pnpm tauri build --target universal-apple-darwin --features vendored-openssl
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create DMG from .app if Tauri did not produce one
        run: |
          # Cargo workspace may put target at repo root (./target) or in src-tauri (src-tauri/target)
          if [ -d "target/universal-apple-darwin" ] || [ -d "target/release" ]; then
            TARGET_ROOT="target"
          elif [ -d "src-tauri/target" ]; then
            TARGET_ROOT="src-tauri/target"
          else
            echo "::error::No target dir found (tried ./target and ./src-tauri/target). Ensure 'Build Tauri app' ran successfully."
            exit 1
          fi
          echo "Using TARGET_ROOT=$TARGET_ROOT"
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          DMG_DIR="$TARGET_ROOT/universal-apple-darwin/release/bundle/dmg"
          DMG_PATH="$DMG_DIR/Rebebuca_${VERSION_NUM}_universal.dmg"
          if [ -f "$DMG_PATH" ]; then
            echo "DMG already exists at $DMG_PATH"
            exit 0
          fi
          EXISTING_DMG=$(find "$TARGET_ROOT" -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -n "$EXISTING_DMG" ] && [ -f "$EXISTING_DMG" ]; then
            echo "DMG exists at $EXISTING_DMG, copying to expected path"
            mkdir -p "$DMG_DIR"
            cp "$EXISTING_DMG" "$DMG_PATH"
            exit 0
          fi
          APP=$(find "$TARGET_ROOT" -name "Rebebuca.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP_TGZ=$(find "$TARGET_ROOT" -name "Rebebuca.app.tar.gz" -type f 2>/dev/null | head -1)
            if [ -z "$APP_TGZ" ]; then
              echo "No .dmg, Rebebuca.app or Rebebuca.app.tar.gz found under $TARGET_ROOT"
              find "$TARGET_ROOT" -type d -name "bundle" 2>/dev/null | while read d; do echo "--- $d ---"; ls -la "$d" 2>/dev/null; done
              exit 1
            fi
            EXTRACT_DIR=$(mktemp -d)
            tar -xzf "$APP_TGZ" -C "$EXTRACT_DIR"
            APP=$(find "$EXTRACT_DIR" -maxdepth 1 -name "Rebebuca.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP" ]; then
              echo "No Rebebuca.app inside tarball"; ls -la "$EXTRACT_DIR"; exit 1
            fi
          fi
          echo "Creating DMG from $APP"
          mkdir -p "$DMG_DIR"
          hdiutil create -srcfolder "$APP" -volname "Rebebuca" -ov -format UDZO "$DMG_PATH"
          echo "Created $DMG_PATH"
          [ -n "${EXTRACT_DIR:-}" ] && rm -rf "$EXTRACT_DIR"

      - name: Install rclone
        run: brew install rclone jq

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ID }}
          secret_access_key = ${{ secrets.R2_SECRET }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload artifacts to R2
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          for TARGET_ROOT in target src-tauri/target; do
            [ -d "$TARGET_ROOT" ] || continue
            DMG_PATH="$TARGET_ROOT/universal-apple-darwin/release/bundle/dmg/Rebebuca_${VERSION_NUM}_universal.dmg"
            [ -f "$DMG_PATH" ] && break
            DMG_PATH=$(find "$TARGET_ROOT" -name "*.dmg" -type f 2>/dev/null | head -1)
            [ -n "$DMG_PATH" ] && break
          done
          if [ -z "$DMG_PATH" ] || [ ! -f "$DMG_PATH" ]; then
            echo "ERROR: No DMG found"; find target src-tauri/target -name "*.dmg" 2>/dev/null; exit 1
          fi
          rclone copyto "$DMG_PATH" "r2:monibuca/rb/${VERSION}/Rebebuca_${VERSION_NUM}_universal.dmg" --progress
          
          MACOS_BUNDLE=""
          for TARGET_ROOT in target src-tauri/target; do
            [ -d "$TARGET_ROOT/universal-apple-darwin/release/bundle/macos" ] && MACOS_BUNDLE="$TARGET_ROOT/universal-apple-darwin/release/bundle/macos" && break
            MACOS_BUNDLE=$(find "$TARGET_ROOT" -type d -path "*/bundle/macos" 2>/dev/null | head -1)
            [ -n "$MACOS_BUNDLE" ] && break
          done
          if [ -n "$MACOS_BUNDLE" ] && [ -d "$MACOS_BUNDLE" ]; then
            rclone copy "$MACOS_BUNDLE" r2:monibuca/rb/${VERSION}/macos --progress
          fi
          
          # Upload remote-agent binaries to version root
          rclone copyto remote-agent/target/x86_64-apple-darwin/release/rebebuca-remote-agent \
            "r2:monibuca/rb/${VERSION}/rebebuca-remote-agent-x86_64-apple-darwin" --progress || true
          rclone copyto remote-agent/target/aarch64-apple-darwin/release/rebebuca-remote-agent \
            "r2:monibuca/rb/${VERSION}/rebebuca-remote-agent-aarch64-apple-darwin" --progress || true

      - name: Update latest.json (add macOS signature)
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          
          MACOS_BUNDLE=""
          for TARGET_ROOT in target src-tauri/target; do
            [ -d "$TARGET_ROOT" ] || continue
            [ -d "$TARGET_ROOT/universal-apple-darwin/release/bundle/macos" ] && MACOS_BUNDLE="$TARGET_ROOT/universal-apple-darwin/release/bundle/macos" && break
            MACOS_BUNDLE=$(find "$TARGET_ROOT" -type d -path "*/bundle/macos" 2>/dev/null | head -1)
            [ -n "$MACOS_BUNDLE" ] && break
          done
          MAC_SIG=$(cat "${MACOS_BUNDLE}/Rebebuca.app.tar.gz.sig" 2>/dev/null || echo "")
          
          # Download existing latest.json or create new one
          rclone copyto r2:monibuca/rb/latest.json latest.json 2>/dev/null || echo '{"version":"","platforms":{}}' > latest.json
          
          # Add or update macOS platform in latest.json
          if [ "$MAC_SIG" != "" ]; then
            jq --arg version "$VERSION_NUM" \
               --arg sig "$MAC_SIG" \
               --arg url "https://download.m7s.live/rb/${VERSION}/macos/Rebebuca.app.tar.gz" \
               '.platforms["darwin-universal"] = {signature: $sig, url: $url} | .version = $version' \
               latest.json > latest-new.json
            mv latest-new.json latest.json
          fi
          
          # Upload updated latest.json
          rclone copyto latest.json r2:monibuca/rb/latest.json --progress

  build-windows:
    needs: cleanup-caches
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            remote-agent -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build --features vendored-openssl
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Install rclone
        shell: bash
        run: choco install rclone -y

      - name: Configure rclone for R2
        shell: bash
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ID }}
          secret_access_key = ${{ secrets.R2_SECRET }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload artifacts to R2
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          MSI=""
          for TARGET_ROOT in target src-tauri/target; do
            [ -d "$TARGET_ROOT" ] || continue
            [ -f "$TARGET_ROOT/release/bundle/msi/Rebebuca_${VERSION_NUM}_x64_en-US.msi" ] && MSI="$TARGET_ROOT/release/bundle/msi/Rebebuca_${VERSION_NUM}_x64_en-US.msi" && break
            MSI=$(find "$TARGET_ROOT" -name "*.msi" -type f 2>/dev/null | head -1)
            [ -n "$MSI" ] && break
          done
          if [ -z "$MSI" ] || [ ! -f "$MSI" ]; then
            echo "ERROR: No .msi found (checked target/ and src-tauri/target/)"
            find target src-tauri/target -type d -name "bundle" 2>/dev/null | while read d; do echo "--- $d ---"; ls -la "$d" 2>/dev/null; done
            exit 1
          fi
          echo "Uploading MSI: $MSI"
          rclone copyto "$MSI" "r2:monibuca/rb/${VERSION}/Rebebuca_${VERSION_NUM}_x64_en-US.msi" --progress
          if [ -f "${MSI}.sig" ]; then
            rclone copyto "${MSI}.sig" "r2:monibuca/rb/${VERSION}/Rebebuca_${VERSION_NUM}_x64_en-US.msi.sig" --progress
          fi

      - name: Update latest.json (add Windows signature)
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          MSI=""
          for TARGET_ROOT in target src-tauri/target; do
            [ -d "$TARGET_ROOT" ] || continue
            [ -f "$TARGET_ROOT/release/bundle/msi/Rebebuca_${VERSION_NUM}_x64_en-US.msi" ] && MSI="$TARGET_ROOT/release/bundle/msi/Rebebuca_${VERSION_NUM}_x64_en-US.msi" && break
            MSI=$(find "$TARGET_ROOT" -name "*.msi" -type f 2>/dev/null | head -1)
            [ -n "$MSI" ] && break
          done
          WIN_SIG=$(cat "${MSI}.sig" 2>/dev/null || echo "")
          
          # Download existing latest.json
          rclone copyto r2:monibuca/rb/latest.json latest.json 2>/dev/null || echo '{"version":"","platforms":{}}' > latest.json
          
          # Add or update Windows platform in latest.json
          if [ "$WIN_SIG" != "" ]; then
            jq --arg version "$VERSION_NUM" \
               --arg sig "$WIN_SIG" \
               --arg url "https://download.m7s.live/rb/${VERSION}/Rebebuca_${VERSION_NUM}_x64_en-US.msi" \
               '.platforms["windows-x86_64"] = {signature: $sig, url: $url} | .version = $version' \
               latest.json > latest-new.json
            mv latest-new.json latest.json
          fi
          
          # Upload updated latest.json
          rclone copyto latest.json r2:monibuca/rb/latest.json --progress

      - name: Generate and upload releases.json
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          DATE=$(date +%Y-%m-%d)
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:'- %s' | head -20)
          else
            NOTES=$(git log --pretty=format:'- %s' --reverse | head -20)
          fi
          
          # Download existing releases.json or create empty one
          rclone copyto r2:monibuca/rb/releases.json releases.json 2>/dev/null || true
          
          # Check if file exists and is valid JSON, otherwise create empty one
          if [ ! -f releases.json ] || ! jq empty releases.json 2>/dev/null; then
            echo '{"latest":"","releases":[]}' > releases.json
          fi
          
          # Update releases.json with new release
          jq --arg version "$VERSION_NUM" \
             --arg date "$DATE" \
             --arg body "$NOTES" \
             '{
               latest: $version,
               releases: ([{version: $version, date: $date, body: $body}] + [.releases[] | select(.version != $version)]) | .[0:20]
             }' releases.json > releases-new.json
          
          mv releases-new.json releases.json
          
          # Upload to R2
          rclone copyto releases.json r2:monibuca/rb/releases.json --progress
