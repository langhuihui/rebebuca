name: Build Tauri App (Windows)

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  cleanup-caches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate current cache hashes
        id: hashes
        run: |
          PNPM_HASH=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1 | head -c 16)
          echo "pnpm_hash=$PNPM_HASH" >> $GITHUB_OUTPUT
          echo "Current pnpm hash: $PNPM_HASH"

      - name: Cleanup outdated caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up outdated caches..."
          
          PNPM_HASH="${{ steps.hashes.outputs.pnpm_hash }}"
          
          gh cache list --limit 100 --json id,key | jq -r '.[] | "\(.id) \(.key)"' | while read -r id key; do
            DELETE=false
            
            if echo "$key" | grep -q "pnpm-store"; then
              if ! echo "$key" | grep -q "$PNPM_HASH"; then
                DELETE=true
              fi
            fi
            
            if echo "$key" | grep -qE "^(Linux|macOS|Windows|linux)-cargo"; then
              DELETE=true
            fi
            
            if [ "$DELETE" = true ]; then
              echo "Deleting outdated cache: $key (id: $id)"
              gh cache delete "$id" || true
            fi
          done
          
          echo "Cache cleanup completed"

  build-remote-server:
    needs: cleanup-caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            remote-agent-server -> target
            common -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend for server
        run: pnpm build:server

      - name: Build remote-agent-server for Linux
        run: |
          cd remote-agent-server
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package remote-agent-server with web assets
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#win-}
          mkdir -p package/rebebuca-remote-server
          cp remote-agent-server/target/x86_64-unknown-linux-gnu/release/rebebuca-remote-server package/rebebuca-remote-server/
          cp -r dist package/rebebuca-remote-server/
          cd package
          tar -czvf rebebuca-remote-server-linux-x86_64.tar.gz rebebuca-remote-server

      - name: Install rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone jq

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ID }}
          secret_access_key = ${{ secrets.R2_SECRET }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload remote-agent-server to R2
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#win-}
          rclone copyto package/rebebuca-remote-server-linux-x86_64.tar.gz \
            r2:monibuca/rb/${VERSION}/remote-agent-server/rebebuca-remote-server-linux-x86_64.tar.gz --progress
          # Installer script resolves latest via releases.json (no rb/latest required)
          rclone copyto scripts/install-remote-server.sh \
            r2:monibuca/rb/install-remote-server.sh --progress

  build-windows:
    needs: cleanup-caches
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            remote-agent -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Install rclone
        shell: bash
        run: choco install rclone -y

      - name: Configure rclone for R2
        shell: bash
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ID }}
          secret_access_key = ${{ secrets.R2_SECRET }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload artifacts to R2
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#win-}
          rclone copy src-tauri/target/release/bundle r2:monibuca/rb/${VERSION} --progress

      - name: Update latest.json (add Windows signature)
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#win-}
          VERSION_NUM=${VERSION#v}
          
          WIN_SIG=$(cat src-tauri/target/release/bundle/nsis/Rebebuca_${VERSION_NUM}_x64-setup.exe.sig 2>/dev/null || echo "")
          
          # Download existing latest.json
          rclone copyto r2:monibuca/rb/latest.json latest.json 2>/dev/null || echo '{}' > latest.json
          
          # Add or update Windows platform in latest.json
          if [ "$WIN_SIG" != "" ]; then
            jq --arg version "$VERSION_NUM" \
               --arg sig "$WIN_SIG" \
               --arg url "https://download.m7s.live/rb/${VERSION}/nsis/Rebebuca_${VERSION_NUM}_x64-setup.exe" \
               '.platforms["windows-x86_64"] = {signature: $sig, url: $url} | .version = $version' \
               latest.json > latest-new.json
            mv latest-new.json latest.json
          fi
          
          # Upload updated latest.json
          rclone copyto latest.json r2:monibuca/rb/latest.json --progress

      - name: Generate and upload releases.json
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#win-}
          VERSION_NUM=${VERSION#v}
          DATE=$(date +%Y-%m-%d)
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:'- %s' | head -20)
          else
            NOTES=$(git log --pretty=format:'- %s' --reverse | head -20)
          fi
          
          # Download existing releases.json or create empty one
          rclone copyto r2:monibuca/rb/releases.json releases.json 2>/dev/null || true
          
          # Check if file exists and is valid JSON, otherwise create empty one
          if [ ! -f releases.json ] || ! jq empty releases.json 2>/dev/null; then
            echo '{"latest":"","releases":[]}' > releases.json
          fi
          
          # Update releases.json with new release
          jq --arg version "$VERSION_NUM" \
             --arg date "$DATE" \
             --arg body "$NOTES" \
             '{
               latest: $version,
               releases: ([{version: $version, date: $date, body: $body}] + [.releases[] | select(.version != $version)]) | .[0:20]
             }' releases.json > releases-new.json
          
          mv releases-new.json releases.json
          
          # Upload to R2
          rclone copyto releases.json r2:monibuca/rb/releases.json --progress
