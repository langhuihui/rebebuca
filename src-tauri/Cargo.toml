[package]
name = "rebebuca"
version = "0.5.2"
description = "A modern desktop application that helps developers quickly manage and execute various commands and scripts. Supports working directory, environment variables, and real-time output."
authors = ["dexter"]
edition = "2021"
default-run = "rebebuca"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Note: rebebuca-remote-agent is built separately in ../remote-agent/ 
# and cross-compiled for Linux. The binary is stored in src-tauri/rebebuca-remote-agent
# and copied to resources during build.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Common library
rebebuca-common = { path = "../common" }

tauri = { version = "2", features = ["macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
sysinfo = "0.30"
portable-pty = "0.8"
log = "0.4"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
base64 = "0.21"
lazy_static = "1.4"

# Explicitly add openssl-sys with vendored feature for universal builds
openssl-sys = { version = "0.9", features = ["vendored"] }

# MCP HTTP Server
axum = "0.7"
tokio-stream = "0.1"
futures = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
