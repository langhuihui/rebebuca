# Cargo configuration for Tauri builds

[build]
# For universal macOS builds, ensure proper cross-compilation
rustflags = []

[target.x86_64-apple-darwin]
# Configuration for Intel macOS builds
rustflags = []

[target.aarch64-apple-darwin]
# Configuration for Apple Silicon macOS builds
rustflags = []

# Environment variables for OpenSSL
[env]
# Use vendored OpenSSL by default for universal builds
# This can be overridden by setting OPENSSL_STATIC=0
OPENSSL_STATIC = { value = "1", condition = { env_not_set = ["OPENSSL_STATIC"] } }