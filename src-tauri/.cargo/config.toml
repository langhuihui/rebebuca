# Cargo configuration for Tauri builds

[build]
# For universal macOS builds, ensure proper cross-compilation
rustflags = []
# Enable incremental compilation for faster rebuilds
incremental = true
# Use more jobs for parallel compilation (adjust based on your CPU cores)
# jobs = 4

[target.x86_64-apple-darwin]
# Configuration for Intel macOS builds
rustflags = []

[target.aarch64-apple-darwin]
# Configuration for Apple Silicon macOS builds
rustflags = []

# Environment variables for OpenSSL
[env]
# In development, use system OpenSSL (faster)
# For release builds with vendored-openssl feature, this will be overridden
# OPENSSL_STATIC is not needed when using system OpenSSL