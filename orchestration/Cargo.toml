[package]
name = "rebebuca-orchestration"
version = "0.1.0"
edition = "2021"
description = "Agent orchestration framework for Rebebuca - supports Supervisor-Worker patterns"
license = "MIT"

[dependencies]
# Common library
rebebuca-common = { path = "../common" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
log = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
