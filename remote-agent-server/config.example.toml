# Rebebuca Server Configuration Example
# Copy this file to rebebuca-server.toml and modify as needed

[server]
# Host to bind to (0.0.0.0 for all interfaces)
host = "0.0.0.0"
# Port to listen on
port = 8080
# Directory containing the Vue frontend build (dist)
static_dir = "./dist"

# TLS configuration (optional, for HTTPS)
# tls_cert = "/path/to/cert.pem"
# tls_key = "/path/to/key.pem"

[auth]
# Simple password authentication
# If not set, no authentication required (development mode)
# password = "your-secure-password"

# Session token expiry in hours
session_expiry_hours = 24

[security]
# Allowed paths for file system access (whitelist)
# If empty, all paths are allowed
# allowed_paths = ["/home/user/projects", "/var/www"]

# Denied commands (blacklist) - not yet implemented
# denied_commands = ["rm -rf /"]
