[package]
name = "rebebuca-remote-server"
version = "0.5.3"
edition = "2021"
description = "Remote server for Rebebuca - provides WebSocket API for web frontend"
license = "MIT"

[dependencies]
# Common library
rebebuca-common = { path = "../common" }
# Orchestration library
rebebuca-orchestration = { path = "../orchestration" }

# Async trait
async-trait = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# PTY and system
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
libc = "0.2"
sysinfo = "0.32"

# Authentication
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
time = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"
tokio-util = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hyper = "1" 

# CLI
clap = { version = "4", features = ["derive"] }

# MIME types
mime_guess = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
